worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format privacy '$request_id $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout privacy;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    client_max_body_size 6m;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=client_connections:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream backend_upstream {
        server backend:8080;
        keepalive 16;
    }

    upstream frontend_upstream {
        server frontend:8080;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        location = /_health {
            access_log off;
            default_type text/plain;
            return 200 'UP\n';
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        limit_conn client_connections 30;

        location = /_health {
            access_log off;
            default_type text/plain;
            return 200 'UP\n';
        }

        location = /api/auth/login {
            limit_req zone=login_rate burst=5 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/ {
            limit_req zone=api_rate burst=40 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params;
        }

        location / {
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_params;
        }
    }
}
