spring:
  application:
    name: restaurant-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurant}
    username: ${DB_USERNAME:restaurant_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${APP_PRODUCT_IMAGE_MAX_SIZE:5MB}
      max-request-size: ${APP_PRODUCT_IMAGE_MAX_REQUEST_SIZE:6MB}

server:
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        name: RESTAURANT_SESSION
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: strict
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  restaurant:
    time-zone: ${APP_RESTAURANT_TIME_ZONE:Africa/Casablanca}
  product-images:
    directory: ${APP_PRODUCT_IMAGES_DIRECTORY:./data/product-images}
    max-size-bytes: ${APP_PRODUCT_IMAGE_MAX_BYTES:5242880}
    max-pixels: ${APP_PRODUCT_IMAGE_MAX_PIXELS:12000000}
  security:
    bcrypt-strength: ${APP_BCRYPT_STRENGTH:12}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    login-attempts:
      maximum: ${APP_LOGIN_MAX_ATTEMPTS:5}
      window: ${APP_LOGIN_ATTEMPT_WINDOW:15m}

logging:
  level:
    root: INFO
