spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      auto-commit: false
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: ${APP_PRODUCT_IMAGE_MAX_SIZE:5MB}
      max-request-size: ${APP_PRODUCT_IMAGE_MAX_REQUEST_SIZE:6MB}

server:
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:15m}
      cookie:
        name: RESTAURANT_SESSION
        path: /
        http-only: true
        secure: true
        same-site: strict
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  product-images:
    directory: ${APP_PRODUCT_IMAGES_DIRECTORY}
    max-size-bytes: ${APP_PRODUCT_IMAGE_MAX_BYTES:5242880}
    max-pixels: ${APP_PRODUCT_IMAGE_MAX_PIXELS:12000000}
  security:
    bcrypt-strength: ${APP_BCRYPT_STRENGTH:12}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    login-attempts:
      maximum: ${APP_LOGIN_MAX_ATTEMPTS:5}
      window: ${APP_LOGIN_ATTEMPT_WINDOW:15m}

logging:
  level:
    root: INFO
    com.restaurant.management: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
